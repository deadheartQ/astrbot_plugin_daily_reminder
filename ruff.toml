# 插件自带 ruff 配置，让检查口径可复现（不依赖上层目录的配置）。
# line-length 取 100：代码里中文提示串较多，88 会折得很难读。
line-length = 100

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ISC", "RUF", "BLE"]
ignore = [
    "RUF001", # 中文全角标点不算「易混淆字符」
    "RUF002",
    "RUF003",
    # 这几条都是刻意的：插件里"吞掉异常继续跑"是设计目标 ——
    # 兜底登记命名空间包失败、记日志失败、取数据目录换下一种取法，
    # 都不该影响插件加载或提醒发送。BLE001 已经把裸 except 挡住了。
    "S110", # try-except-pass
    "S112", # try-except-continue
]
